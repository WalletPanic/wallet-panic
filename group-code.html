<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Group Code | Wallet Panic</title>

    <link rel="stylesheet" href="group.css?v=2">
</head>

<body>

    <!-- 왼쪽 사이드바 -->
    <aside class="sidebar">

    <a href="dashboard.html">
        <img
            src="wallet-panic.png"
            alt="Wallet Panic"
            class="sidebar-logo"
        >
    </a>

        <nav class="sidebar-menu">

            <!--
                로그인하면 auth.js가
                LOG OUT (이메일)로 변경
            -->
            <a
                href="index.html"
                class="login-link"
            >
                LOG IN / SIGN UP
            </a>

            <div class="group-menu">

                <a
                    href="new-group.html"
                    class="active"
                >
                    +NEW GROUP
                </a>

                <a href="#">
                    JOIN WITH CODE
                </a>

                <a href="#">
                    SHARED GROUPS
                </a>

            </div>

            <a
                href="#"
                class="feedback-link"
            >
                SEND FEEDBACK
            </a>

        </nav>

        <!-- 알림 버튼 -->
        <button
            type="button"
            class="notification-button"
        >
            <span class="bell">🔔</span>

            <span>
                NOTIFI-<br>
                CATIONS
            </span>
        </button>

    </aside>

    <!-- 오른쪽 메인 화면 -->
    <main class="main-content">

        <!-- 그룹 코드 카드 -->
        <section class="group-card code-card">

            <span class="hash">#</span>

            <!-- 생성된 그룹 코드 -->
            <span
                id="groupCode"
                class="group-code"
            ></span>

            <!-- 코드 복사 버튼 -->
            <button
                type="button"
                id="copyButton"
                class="copy-button"
                aria-label="코드 복사"
            >
                <span class="copy-back"></span>
                <span class="copy-front"></span>
            </button>

        </section>

        <!-- 그룹 생성 버튼 -->
        <button
            type="button"
            id="createButton"
            class="main-button"
        >
            CREATE
        </button>

    </main>

    <!-- 1. Supabase 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 2. Supabase 프로젝트 연결 -->
    <script src="supabase-config.js?v=1"></script>

    <!-- 3. 로그인 확인 및 로그아웃 -->
    <script src="auth.js?v=2"></script>

    <!-- 4. 그룹 코드 생성 및 복사 기능 -->
    <script src="group-code.js?v=1"></script>

</body>
</html>
