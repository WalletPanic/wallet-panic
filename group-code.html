<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Group Code | Wallet Panic</title>

    <link rel="stylesheet" href="group.css?v=1">
</head>

<body>

    <aside class="sidebar">

        <img
            src="wallet-panic.png"
            alt="Wallet Panic"
            class="sidebar-logo"
        >

        <nav class="sidebar-menu">

            <a href="index.html" class="login-link">
                LOG IN / SIGN UP
            </a>

            <div class="group-menu">

                <a href="new-group.html" class="active">
                    +NEW GROUP
                </a>

                <a href="#">
                    JOIN WITH CODE
                </a>

                <a href="#">
                    SHARED GROUPS
                </a>

            </div>

            <a href="#" class="feedback-link">
                SEND FEEDBACK
            </a>

        </nav>

        <button class="notification-button">
            <span class="bell">🔔</span>

            <span>
                NOTIFI-<br>
                CATIONS
            </span>
        </button>

    </aside>


    <main class="main-content">

        <section class="group-card code-card">

            <span class="hash">#</span>

            <span id="groupCode" class="group-code">
            </span>


            <button
                type="button"
                id="copyButton"
                class="copy-button"
                aria-label="코드 복사"
            >
                <span class="copy-back"></span>
                <span class="copy-front"></span>
            </button>

        </section>


        <button
            type="button"
            id="createButton"
            class="main-button"
        >
            CREATE
        </button>

    </main>


    <script src="group-code.js"></script>

</body>
</html>
