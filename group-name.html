<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Group Name | Wallet Panic</title>

    <link rel="stylesheet" href="group.css?v=2">
</head>

<body>

    <!-- 왼쪽 사이드바 -->
    <aside class="sidebar">

        <img
            src="wallet-panic.png"
            alt="Wallet Panic"
            class="sidebar-logo"
        >

        <nav class="sidebar-menu">

            <!--
                로그인하면 auth.js가
                LOG OUT (이메일)로 변경
            -->
            <a
                href="index.html"
                class="login-link"
            >
                LOG IN / SIGN UP
            </a>

            <div class="group-menu">

                <a
                    href="new-group.html"
                    class="active"
                >
                    +NEW GROUP
                </a>

                <a href="#">
                    JOIN WITH CODE
                </a>

                <a href="#">
                    SHARED GROUPS
                </a>

            </div>

            <a
                href="#"
                class="feedback-link"
            >
                SEND FEEDBACK
            </a>

        </nav>

        <!-- 알림 버튼 -->
        <button
            type="button"
            class="notification-button"
        >
            <span class="bell">🔔</span>

            <span>
                NOTIFI-<br>
                CATIONS
            </span>
        </button>

    </aside>

    <!-- 오른쪽 메인 화면 -->
    <main class="main-content">

        <section class="group-card name-card">

            <!-- 그룹명 입력 -->
            <input
                type="text"
                id="groupName"
                maxlength="20"
                placeholder="Enter Your Group Name"
                autocomplete="off"
            >

            <div class="name-underline"></div>

            <!-- 글자 수 표시 -->
            <p class="character-count">
                <span id="currentLength">0</span>/20
            </p>

        </section>

        <!-- 다음 페이지 이동 -->
        <button
            type="button"
            id="nameNext"
            class="main-button"
        >
            NEXT
        </button>

    </main>

    <!-- 1. Supabase 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 2. Supabase 프로젝트 연결 -->
    <script src="supabase-config.js?v=1"></script>

    <!-- 3. 로그인 확인 및 로그아웃 -->
    <script src="auth.js?v=2"></script>

    <!-- 4. 그룹명 입력 기능 -->
    <script src="group-name.js?v=1"></script>

</body>
</html>
