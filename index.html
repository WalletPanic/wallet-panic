<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Wallet Panic</title>

    <link rel="stylesheet" href="style.css?v=7">
</head>

<body>

    <!-- Wallet Panic 로고 -->
    <header class="logo">
        <a href="index.html">
            <img
                src="wallet-panic.png"
                alt="Wallet Panic"
            >
        </a>
    </header>

    <!-- 로그인 영역 -->
    <main class="login-container">

        <div class="login-box">

            <h1>
                <strong>Sign in</strong> to your account
            </h1>

            <form id="loginForm" novalidate>

                <!-- Email -->
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Email"
                    autocomplete="email"
                    maxlength="254"
                    required
                >

                <!-- Password -->
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    maxlength="72"
                    required
                >

                <!-- 로그인 오류 메시지 -->
                <p
                    id="formMessage"
                    class="form-message"
                    role="alert"
                    aria-live="polite"
                ></p>

                <!-- 로그인 버튼 -->
                <button
                    type="submit"
                    class="auth-button"
                >
                    SIGN IN
                </button>

                <!-- 회원가입 페이지 연결 -->
                <div class="forgot-password">

                    <span>
                        New to Wallet Panic?
                    </span>

                    <a
                        href="signup.html"
                        class="signup-link"
                    >
                        Create an account.
                    </a>

                </div>

            </form>

        </div>

    </main>

    <!-- Supabase JavaScript 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Supabase 주소와 Publishable Key -->
    <script src="supabase-config.js"></script>

    <!-- 로그인 기능 -->
    <script src="script.js"></script>

</body>
</html>
