<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wallet Panic</title>

    <link rel="stylesheet" href="style.css?v=2">
</head>

<body>

    <!-- Wallet Panic 로고 -->
    <header class="logo">
        <img src="wallet-panic.png" alt="Wallet Panic">
    </header>


    <!-- 로그인 -->
    <main class="login-container">

        <div class="login-box">

            <h1>
                <strong>Sign in</strong> to your account
            </h1>

            <form id="loginForm">

                <input
                    type="text"
                    id="userId"
                    placeholder="ID"
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                >

                <div class="forgot-password">
                    <span>Forgot your password?</span>
                    <span class="tough-luck">Tough luck.</span>
                </div>

            </form>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
