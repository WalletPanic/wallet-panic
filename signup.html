<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Wallet Panic</title>
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
    <header class="logo">
        <img src="wallet-panic.png" alt="Wallet Panic">
    </header>

    <main class="login-container">
        <div class="login-box signup-box">
            <h1><strong>Create</strong> your account</h1>

            <form id="signupForm" novalidate>
                <input type="text" id="userId" placeholder="ID" autocomplete="username" maxlength="30" required>
                <p class="input-hint">3–30 letters, numbers, or _</p>
                <input type="password" id="password" placeholder="Password" autocomplete="new-password" maxlength="72" required>
                <input type="password" id="confirmPassword" placeholder="Confirm password" autocomplete="new-password" maxlength="72" required>

                <p id="formMessage" class="form-message" role="alert" aria-live="polite"></p>
                <button type="submit" class="auth-button">CREATE ACCOUNT</button>

                <div class="forgot-password">
                    <span>Already have an account?</span>
                    <a href="index.html" class="signup-link">Sign in.</a>
                </div>
            </form>
        </div>
    </main>

    <script src="signup.js"></script>
</body>
</html>
